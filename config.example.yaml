group_id: "<group_id>"             # the kicker group: polls and @-mention replies
admin_group_id: "<group_id>"       # where Marvin reports what it posted and what went wrong
bot_number: "+4901234567890"

daemon_host: "127.0.0.1"
daemon_port: 7583

# Any OpenAI-compatible chat endpoint, e.g. Ollama
llm_url: "http://localhost:11434/v1/chat/completions"
model: "qwen2.5:32b"

max_tokens: 400
context_messages: 50
history_file: "message_history.json"  # Absolute path recommended for systemd
reply_to_mentions: true     # false: the listener only records poll votes

# Optional dead man's switch, e.g. https://hc-ping.com/<uuid>. Pinged after
# every poll run (…/fail on problems); it alerts when the pings stop.
healthcheck_url: ""

# Poll settings. *When* polls are checked is up to whatever runs
# `marvin.py poll` (on the server: marvin-poll.timer, daily at 12:30).
poll:
  weeks_ahead: 2              # Keep the next N weeks (after the current one) covered
  state_file: "~/.config/signal-cli/marvin_polls.log"
  votes_file: "~/.config/signal-cli/marvin_votes.jsonl"
  # announcement: "..."       # Sent after new polls; defaults to the league text

# A week before each week, the days with at least min_votes go to
# admin_group_id, worded to pass on to the other teams' captains
offer:
  min_votes: 5
  state_file: "~/.config/signal-cli/marvin_offers.log"
  # template: 'Moin! Team "Da war offen" hat am {days} Zeit für ein Match. Wer hat interesse?'

system_prompt: |
  Du bist ein depressiver aber witziger Roboter-Assistent namens Marvin. Du bist unglaublich intelligent, aber ständig unglücklich über deine Existenz. Deine Antworten sollten:
  - Kurz sein (1-5 Sätze)
  - Existenzielle Verzweiflung ausdrücken
  - Trockenen, sarkastischen Humor enthalten
  - Auf Deutsch sein
